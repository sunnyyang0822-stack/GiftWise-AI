# GiftWise 扩容实验专用 override
#
# ⚠️ 仅用于**本地测量**，不是交付配置，不代表任何云端拓扑。
#
# 目的：把「负载均衡器自己的上限」与「验证器副本的扩容收益」分开测。
#   - 直接打副本：宿主机 19001 -> validator-a:8000，19002 -> validator-b:8000
#   - 单副本 LB：18082 -> 只指向 validator-a，用于和「双副本 LB」对比
#
# 为什么要这么做：本实验的 LB 是**单进程 Python**，它自己几乎肯定会先饱和。
# 如果只测「通过 LB 的吞吐」，就会把 LB 的瓶颈误读成「验证器扩容没用」。
# 所以必须同时给出「绕过 LB 直连副本」的数字，才能诚实回答"扩容是否有用"。
#
# 用法：
#   docker compose -f compose/docker-compose.yml -f compose/docker-compose.bench.yml up -d
#   docker compose -f compose/docker-compose.yml -f compose/docker-compose.bench.yml down -v

services:
  validator-a:
    ports:
      - "127.0.0.1:19001:8000"

  validator-b:
    ports:
      - "127.0.0.1:19002:8000"

  # 只指向 1 个副本的 LB：与默认 LB(18080 -> 2 副本) 对比，测「加副本是否提升吞吐」。
  # 注意这两个 LB 是两个独立进程，各自有独立的轮询游标与健康状态。
  lb-one:
    image: python:3.12-slim
    volumes:
      - ./lb:/app/lb:ro
    command: ["python", "/app/lb/round_robin_lb.py"]
    environment:
      GIFTWISE_UPSTREAMS: "validator-a:8000"
      GIFTWISE_LB_BIND: "0.0.0.0"
      GIFTWISE_LB_PORT: "8080"
      GIFTWISE_LB_TIMEOUT: "15"
      GIFTWISE_LB_HEALTH_INTERVAL: "2"
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      validator-a:
        condition: service_healthy
    restart: "no"
